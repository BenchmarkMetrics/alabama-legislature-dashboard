<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Alabama Legislative Dashboard</title>
<script>
var base = "/alabama-legislature-dashboard";
var path = window.location.pathname.replace(base, '');
var m;
if (m = path.match(/^\/bills\/([^/]+)\/([^/]+)/)) {
  window.location.replace(base + '/bill-detail.html?session=' + encodeURIComponent(m[1]) + '&id=' + m[2]);
} else if (m = path.match(/^\/legislators\/(\d+)/)) {
  window.location.replace(base + '/legislator-detail.html?id=' + m[1]);
} else {
  window.location.replace(base + '/');
}
</script>
</head>
<body>Redirecting...</body>
</html>
